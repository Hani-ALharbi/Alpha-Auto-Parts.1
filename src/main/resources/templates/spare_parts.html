<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spare Parts Directory</title>
    <!-- تأكد من وضع رابط البوتستراب الكامل هنا إذا كان ناقص عندك -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title">Spare Parts Directory</div>
    </header>

    <div class="content-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <p class="text-muted mb-0 small">Manage your inventory parts</p>
            <a th:href="@{/spare-parts/new}" class="btn-insert">INSERT NEW PART</a>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th style="width: 10%">ID</th>
                    <th style="width: 20%">Part No.</th>
                    <th style="width: 30%">Part Name</th>
                    <th style="width: 20%">Stock Qty</th>
                    <th style="width: 20%" class="text-center">Operations</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="part : ${listSpareParts}">
                    <td th:text="${part.partID}"></td>
                    <td th:text="${part.partNumber}"></td>
                    <td th:text="${part.partName}" class="fw-bold"></td>
                    <td th:text="${part.stockQuantity}"></td>
                    <td class="text-center">
                        <a th:href="@{'/spare-parts/edit/' + ${part.partID}}" class="action-link edit-link me-3">EDIT</a>
                        <a th:href="@{'/spare-parts/delete/' + ${part.partID}}" class="action-link delete-link" 
                           onclick="return confirm('Are you sure you want to remove this part?')">REMOVE</a>
                    </td>
                </tr>
            </tbody>
        </table>
         <div class="mt-4">
            <a th:href="@{/dashboard}" class="cancel-link text-start">&larr; Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
