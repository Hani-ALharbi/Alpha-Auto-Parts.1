<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car Models Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title">Car Models Directory</div>
    </header>

    <div class="content-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <p class="text-muted mb-0 small">Manage car models and their associated brands</p>
            <a th:href="@{/car-models/new}" class="btn-insert">INSERT NEW MODEL</a>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th style="width: 15%">Model ID</th>
                    <th style="width: 25%">Brand ID</th>
                    <th style="width: 30%">Car Name</th>
                    <th style="width: 15%">Status</th>
                    <th style="width: 15%" class="text-center">Operations</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cm : ${listCarModels}">
                    <td th:text="${cm.carModelID}"></td>
                    <td th:text="${cm.brandID}"></td>
                    <td th:text="${cm.carName}" class="fw-bold"></td>
                    <td th:text="${cm.active != null and cm.active ? 'Active' : 'Inactive'}" 
                        th:classappend="${cm.active != null and cm.active ? 'text-success' : 'text-danger'}"></td>
                    <td class="text-center">
                        <a th:href="@{'/car-models/edit/' + ${cm.carModelID}}" class="action-link edit-link me-3">EDIT</a>
                        <a th:href="@{'/car-models/delete/' + ${cm.carModelID}}" class="action-link delete-link" 
                           onclick="return confirm('Are you sure you want to remove this car model?')">REMOVE</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div class="mt-4">
            <a th:href="@{/dashboard}" class="cancel-link text-start">&larr; Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
