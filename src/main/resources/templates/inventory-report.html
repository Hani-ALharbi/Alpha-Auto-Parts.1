<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory Reports - ALPHA AUTO PARTS</title>
    
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
</head>
<body>

    <div class="company-header">
        <div class="company-name">ALPHA AUTO PARTS</div>
        <div class="page-title">Inventory Analytics Dashboard</div>
    </div>

    <div class="content-container">
        
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold text-dark">Stock Overview</h2>
            <a th:href="@{/reports}" class="btn-insert">Back to Hub</a>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="menu-card h-100 p-4">
                    <i class="bi bi-box-seam fs-1 mb-3 text-secondary"></i>
                    <div class="menu-card-title" th:text="${#lists.size(partsList)}">0</div>
                    <div class="menu-card-subtitle">Total Registered Parts</div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="menu-card h-100 p-4">
                    <i class="bi bi-exclamation-triangle fs-1 mb-3 text-danger"></i>
                    <div class="menu-card-title text-danger">Smart Alerts</div>
                    <div class="menu-card-subtitle">Auto-tracking reorder levels</div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="menu-card h-100 p-4 d-flex justify-content-center align-items-center">
                    <canvas id="inventoryChart" style="max-height: 120px;"></canvas>
                </div>
            </div>
        </div>

        <hr class="mb-5 text-muted">

        <h5 class="fw-bold text-secondary mb-4">Detailed Stock List</h5>
        <table id="inventoryTable" class="table display" width="100%">
            <thead>
                <tr>
                    <th>Part Number</th>
                    <th>Part Name</th>
                    <th>Made In</th>
                    <th>Stock Quantity</th>
                    <th>Reorder Level</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="part : ${partsList}">
                    <td th:text="${part.partNumber}"></td>
                    <td class="fw-bold" th:text="${part.partName}"></td>
                    <td th:text="${part.made}"></td>
                    <td th:text="${part.stockQuantity}"
                        th:classappend="${part.stockQuantity <= part.reorderLevel} ? 'text-danger fw-bold' : 'text-success fw-bold'">
                    </td>
                    <td th:text="${part.reorderLevel}"></td>
                </tr>
            </tbody>
        </table>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#inventoryTable').DataTable({
                dom: 'Bfrtip',
                buttons: [
                    'copy', 'csv', 'excel', 'pdf', 'print'
                ],
                pageLength: 10
            });
        });

        const ctx = document.getElementById('inventoryChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['In Stock', 'Low Stock'],
                datasets: [{
                    data: [75, 25], 
                    backgroundColor: ['#8D6E63', '#dc3545'],
                    borderWidth: 0
                }]
            },
            options: {
                plugins: {
                    legend: { display: false }
                },
                maintainAspectRatio: false
            }
        });
    </script>
</body>
</html>
