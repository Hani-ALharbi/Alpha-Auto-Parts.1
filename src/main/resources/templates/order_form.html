<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Add/Edit Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title" th:text="${pageTitle}">Create Order</div>
    </header>

    <div class="form-container">
        <!-- Error Message Display -->
        <div th:if="${errorMessage}" class="alert alert-danger mb-3" th:text="${errorMessage}"></div>
        
        <!-- ركز: الكائن هنا اسمه orderRecord -->
        <form th:action="@{/orders/save}" th:object="${orderRecord}" method="post">
            <input type="hidden" th:field="*{orderID}" />

            <!-- السطر الأول: التاريخ والمبلغ الإجمالي -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Order Date</label>
                    <input type="date" name="orderDateStr" class="form-control" required 
                           th:value="${orderRecord.orderDate != null ? #strings.substring(orderRecord.orderDate.toString(), 0, 4) + '-' + #strings.substring(orderRecord.orderDate.toString(), 4, 6) + '-' + #strings.substring(orderRecord.orderDate.toString(), 6, 8) : ''}" />
                </div>
                <div class="col-md-6">
                    <label class="form-label">Unit Price (Auto-assigned)</label>
                    <select th:field="*{unitPriceID}" class="form-select" style="pointer-events: none; background-color: #e9ecef;">
                        <option value="">-- Auto-assigned from Part --</option>
                        <option th:each="prc : ${listPrices}" 
                                th:value="${prc.unitPriceID}" 
                                th:text="${prc.price} + ' SAR'"></option>
                    </select>
                </div>
            </div>

            <!-- السطر الثاني: العميل والموظف -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Customer</label>
                    <select th:field="*{customerID}" class="form-select" required>
                        <option value="">-- Select Customer --</option>
                        <option th:each="cus : ${listCustomers}" 
                                th:value="${cus.customerID}" 
                                th:text="${cus.fullName}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Processed By (Employee)</label>
                    <select th:field="*{userID}" class="form-select" required>
                        <option value="">-- Select Employee --</option>
                        <option th:each="usr : ${listUsers}" 
                                th:value="${usr.userID}" 
                                th:text="${usr.username}"></option>
                    </select>
                </div>
            </div>

            <!-- السطر الثالث: القطعة وحالة الطلب -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="form-label">Spare Part</label>
                    <select th:field="*{partID}" class="form-select" required>
                        <option value="">-- Select Spare Part --</option>
                        <option th:each="part : ${listParts}" 
                                th:value="${part.partID}" 
                                th:text="${part.stockQuantity != null and part.stockQuantity <= 0 ? part.partName + ' (نفذت من المخزون)' : part.partName}"
                                th:disabled="${part.stockQuantity != null and part.stockQuantity <= 0}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Order Status</label>
                    <select th:field="*{status}" class="form-select" required>
                        <option value="">-- Select Status --</option>
                        <option value="false">Pending (قيد الانتظار)</option>
                        <option value="true">Completed (مكتمل)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">SAVE ORDER</button>
            <a th:href="@{/orders}" class="cancel-link">Back to Directory</a>
        </form>
    </div>

    <script th:inline="javascript">
        const partPriceMap = /*[[${partPriceMap}]]*/ {};
        
        function updatePrice() {
            const partSelect = document.getElementById('partID');
            const priceSelect = document.getElementById('unitPriceID');
            const selectedPartId = partSelect.value;
            
            if (selectedPartId && partPriceMap[selectedPartId]) {
                priceSelect.value = partPriceMap[selectedPartId];
            } else {
                priceSelect.value = '';
            }
        }
        
        document.getElementById('partID').addEventListener('change', updatePrice);
        window.addEventListener('load', updatePrice);
    </script>
</body>
</html>
