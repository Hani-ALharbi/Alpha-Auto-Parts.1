<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sales & Orders Report</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
</head>
<body>
    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title">Sales & Orders Report</div>
    </header>
    <div class="content-container">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold text-dark">Sales Overview</h2>
            <a th:href="@{/reports}" class="btn-insert" style="background-color: #888;">Back to Hub</a>
        </div>
        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="menu-card h-100 p-4">
                    <i class="bi bi-cash-stack fs-1 mb-3 text-success"></i>
                    <div class="menu-card-title text-success" th:text="${totalRevenueStr} + ' SR'">0.00 SR</div>
                    <div class="menu-card-subtitle">Total Revenue</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="menu-card h-100 p-4">
                    <i class="bi bi-cart-check fs-1 mb-3 text-primary"></i>
                    <div class="menu-card-title" th:text="${totalOrders}">0</div>
                    <div class="menu-card-subtitle">Total Orders Processed</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="menu-card h-100 p-4 d-flex justify-content-center align-items-center">
                    <canvas id="salesChart" style="max-height: 120px;"></canvas>
                </div>
            </div>
        </div>
        <!-- Best-Selling Parts Section -->
        <h5 class="fw-bold text-secondary mb-4"><i class="bi bi-star-fill text-warning"></i> Top 5 Best-Selling Parts</h5>
        <div class="row mb-5">
            <div class="col-md-8">
                <table class="table table-bordered bg-white shadow-sm rounded" style="border-radius: 10px; overflow: hidden;">
                    <thead class="table-light">
                        <tr>
                            <th>Part Name</th>
                            <th>Total Units Sold</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="part : ${bestSellingParts}">
                            <td class="fw-bold text-primary" th:text="${part.partName}"></td>
                            <td th:text="${part.salesCount}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(bestSellingParts)}">
                            <td colspan="2" class="text-center text-muted">No sales data available yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <hr class="mb-5 text-muted">
        
        <!-- Filters Section -->
        <div class="row mb-4">
            <div class="col-md-4">
                <label for="statusFilter" class="form-label fw-bold">Filter by Status:</label>
                <select id="statusFilter" class="form-select">
                    <option value="">All Orders</option>
                    <option value="Completed">Completed</option>
                    <option value="Pending">Pending</option>
                </select>
            </div>
        </div>
        
        <h5 class="fw-bold text-secondary mb-4">Detailed Orders List</h5>
        <table id="dataTable" class="table display" width="100%">
            <thead>
                <tr>
                    <th>Order ID</th><th>Date</th><th>Customer Name</th><th>Part Name</th><th>Amount (SR)</th><th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${listOrders}">
                    <td th:text="${order.orderID}"></td><td th:text="${order.orderDate}"></td>
                    <td th:text="${order.customerID != null && customerNames.get(order.customerID) != null ? customerNames.get(order.customerID) : order.customerID}"></td>
                    <td th:text="${order.partID != null && partNames.get(order.partID) != null ? partNames.get(order.partID) : order.partID}"></td>
                    <td class="fw-bold" th:text="${order.unitPriceID != null && pricesMap.get(order.unitPriceID) != null ? pricesMap.get(order.unitPriceID) : 0}"></td>
                    <td th:text="${order.status != null && order.status ? 'Completed' : 'Pending'}"></td>
                </tr>
            </tbody>
        </table>
        <input type="hidden" id="completedVal" th:value="${completedOrders}">
        <input type="hidden" id="pendingVal" th:value="${pendingOrders}">
    </div>
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
    <script th:inline="none">
        $(document).ready(function() {
            var completed = parseInt(document.getElementById('completedVal').value) || 0;
            var pending = parseInt(document.getElementById('pendingVal').value) || 0;
            
            var commonButtons = [
                'copy', 'csv', 'excel', 
                {
                    extend: 'pdfHtml5',
                    title: 'ALPHA AUTO PARTS - Sales & Orders Report',
                    customize: function (doc) {
                        doc.styles.title = { color: '#d1b280', fontSize: '20', alignment: 'center', bold: true };
                        doc.content.splice(0, 0, { text: 'ALPHA AUTO PARTS', style: 'header', alignment: 'center', margin: [0, 0, 0, 10] });
                        doc.styles.header = { fontSize: 24, bold: true, color: '#333333' };
                        doc.styles.tableHeader = { fillColor: '#333333', color: 'white', alignment: 'center' };
                    }
                },
                'print'
            ];
            
            var table;
            try {
                table = $('#dataTable').DataTable({ dom: 'Bfrtip', buttons: commonButtons, pageLength: 10, order: [[ 0, "desc" ]] });
            } catch(e) { console.error("DataTable Init Error:", e); }
            
            if(table) {
                $('#statusFilter').on('change', function() {
                    table.column(5).search(this.value).draw();
                });
            }
            
            try {
                const ctx = document.getElementById('salesChart').getContext('2d');
                new Chart(ctx, { type: 'doughnut', data: { labels: ['Completed', 'Pending'], datasets: [{ data: [completed, pending], backgroundColor: ['#198754', '#ffc107'], borderWidth: 0 }] }, options: { plugins: { legend: { position: 'right' } }, maintainAspectRatio: false } });
            } catch(e) { console.error("Chart Init Error:", e); }
        });
    </script>
</body>
</html>
