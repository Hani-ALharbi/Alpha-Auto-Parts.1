<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Add/Edit Supplier</title>
    <!-- مكتبة البوتستراب -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ملف التصميم الخارجي الموحد -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title" th:text="${pageTitle}">Add Supplier</div>
    </header>

    <div class="form-container">
        <form th:action="@{/suppliers/save}" th:object="${supplier}" method="post">
            <input type="hidden" th:field="*{supplierID}" />

            <!-- السطر الأول: مربعين (نص بنص) -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Supplier Name</label>
                    <input type="text" th:field="*{name}" class="form-control" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input type="number" th:field="*{phoneNumber}" class="form-control" required />
                </div>
            </div>

            <!-- السطر الثاني: مربعين (نص بنص) -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" />
                </div>
                <div class="col-md-6">
                    <label class="form-label">Location</label>
                    <input type="text" th:field="*{location}" class="form-control" />
                </div>
            </div>

            <!-- السطر الثالث: الشيك بوكس (بنفس تنسيق وحواف القطع والمستخدمين) -->
            <div class="row mb-4">
                <div class="col-md-12 d-flex align-items-end pb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeCheck">
                        <label class="form-check-label form-label" for="activeCheck">
                            Is Active Partner?
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">SAVE SUPPLIER</button>
            <a th:href="@{/suppliers}" class="cancel-link">Back to Directory</a>
        </form>
    </div>

</body>
</html>
