<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customers Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title">Customers Directory</div>
    </header>

    <div class="content-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <p class="text-muted mb-0 small">Manage your client base</p>
            <a th:href="@{/customers/new}" class="btn-insert">INSERT NEW CUSTOMER</a>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th style="width: 10%">ID</th>
                    <th style="width: 25%">Full Name</th>
                    <th style="width: 15%">Type</th>
                    <th style="width: 15%">Phone</th>
                    <th style="width: 15%">City</th>
                    <th style="width: 20%" class="text-center">Operations</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cus : ${listCustomers}">
                    <td th:text="${cus.customerID}"></td>
                    <td th:text="${cus.fullName}" class="fw-bold"></td>
                    <td th:text="${cus.type}"></td>
                    <td th:text="${cus.phone}"></td>
                    <td th:text="${cus.city}"></td>
                    <td class="text-center">
                        <a th:href="@{'/customers/edit/' + ${cus.customerID}}" class="action-link edit-link me-3">EDIT</a>
                        <a th:href="@{'/customers/delete/' + ${cus.customerID}}" class="action-link delete-link" 
                           onclick="return confirm('Are you sure you want to remove this customer?')">REMOVE</a>
                    </td>
                </tr>
            </tbody>
        </table>
         <div class="mt-4">
            <a th:href="@{/dashboard}" class="cancel-link text-start">&larr; Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
