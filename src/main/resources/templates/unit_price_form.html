<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Add/Edit Unit Price</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title" th:text="${pageTitle}">Add Unit Price</div>
    </header>

    <div class="form-container">
        <form th:action="@{/unit-prices/save}" th:object="${unitPrice}" method="post">
            <input type="hidden" th:field="*{unitPriceID}" />

            <!-- السطر الأول: إدخال السعر فقط -->
            <div class="row mb-4">
                <div class="col-md-12">
                    <label class="form-label">Price (SAR)</label>
                    <input type="number" th:field="*{price}" class="form-control" required placeholder="Enter price amount" />
                </div>
            </div>

            <!-- السطر الثاني: الشيك بوكس للتفعيل -->
            <div class="row mb-4">
                <div class="col-md-12 d-flex align-items-end pb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeCheck">
                        <label class="form-check-label form-label" for="activeCheck">
                            Is Active Price?
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">SAVE UNIT PRICE</button>
            <a th:href="@{/unit-prices}" class="cancel-link">Back to Directory</a>
        </form>
    </div>

</body>
</html>
