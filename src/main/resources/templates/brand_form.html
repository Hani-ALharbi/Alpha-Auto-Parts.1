<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Add/Edit Brand</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title" th:text="${pageTitle}">Add Brand</div>
    </header>

    <div class="form-container">
        <form th:action="@{/brands/save}" th:object="${brand}" method="post">
            <input type="hidden" th:field="*{brandID}" />

            <!-- السطر الأول: اسم الماركة وبلد الصنع -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="form-label">Brand Name</label>
                    <input type="text" th:field="*{nameBrand}" class="form-control" required placeholder="e.g., Toyota, Bosch..." />
                </div>
                <div class="col-md-6">
                    <label class="form-label">Made In (Country)</label>
                    <input type="text" th:field="*{made}" class="form-control" required placeholder="e.g., Japan, Germany..." />
                </div>
            </div>

            <!-- السطر الثاني: الشيك بوكس للتفعيل -->
            <div class="row mb-4">
                <div class="col-md-12 d-flex align-items-end pb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeCheck">
                        <label class="form-check-label form-label" for="activeCheck">
                            Is Active Brand?
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">SAVE BRAND</button>
            <a th:href="@{/brands}" class="cancel-link">Back to Directory</a>
        </form>
    </div>

</body>
</html>
