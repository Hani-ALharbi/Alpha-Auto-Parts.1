<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Add/Edit Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title" th:text="${pageTitle}">Add Customer</div>
    </header>

    <div class="form-container">
        <form th:action="@{/customers/save}" th:object="${customer}" method="post">
            <input type="hidden" th:field="*{customerID}" />

            <!-- السطر الأول: الاسم ورقم الجوال -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input type="number" th:field="*{phone}" class="form-control" required />
                </div>
            </div>

            <!-- السطر الثاني: نوع العميل والمدينة -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="form-label">Customer Type</label>
                    <select th:field="*{type}" class="form-select" required>
                        <option value="">-- Select Type --</option>
                        <option value="Individuals">Individuals (أفراد)</option>
                        <option value="Workshop">Workshop (ورشة)</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">City</label>
                    <input type="text" th:field="*{city}" class="form-control" required />
                </div>
            </div>

            <button type="submit" class="btn-submit">SAVE CUSTOMER</button>
            <a th:href="@{/customers}" class="cancel-link">Back to Directory</a>
        </form>
    </div>

</body>
</html>
