<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categories Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title">Categories Directory</div>
    </header>

    <div class="content-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <p class="text-muted mb-0 small">Manage spare parts classifications</p>
            <a th:href="@{/categories/new}" class="btn-insert">INSERT NEW CATEGORY</a>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th style="width: 15%">ID</th>
                    <th style="width: 45%">Category Name</th>
                    <th style="width: 20%">Status</th>
                    <th style="width: 20%" class="text-center">Operations</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cat : ${listCategories}">
                    <td th:text="${cat.categoryID}"></td>
                    <td th:text="${cat.categoryName}" class="fw-bold"></td>
                    <!-- إضافة بسيطة: تحويل قيمة boolean إلى نص مفهوم (Yes/No) للمستخدم -->
                    <td th:text="${cat.active != null and cat.active ? 'Active' : 'Inactive'}" 
                        th:classappend="${cat.active != null and cat.active ? 'text-success' : 'text-danger'}"></td>
                    <td class="text-center">
                        <a th:href="@{'/categories/edit/' + ${cat.categoryID}}" class="action-link edit-link me-3">EDIT</a>
                        <a th:href="@{'/categories/delete/' + ${cat.categoryID}}" class="action-link delete-link" 
                           onclick="return confirm('Are you sure you want to remove this category?')">REMOVE</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <!-- زر اختياري للرجوع للداشبورد السابقة -->
        <div class="mt-4">
            <a th:href="@{/dashboard}" class="cancel-link text-start">&larr; Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
