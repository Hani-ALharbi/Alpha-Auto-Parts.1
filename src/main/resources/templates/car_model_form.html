<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Add/Edit Car Model</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title" th:text="${pageTitle}">Add Car Model</div>
    </header>

    <div class="form-container">
        <form th:action="@{/car-models/save}" th:object="${carModel}" method="post">
            <input type="hidden" th:field="*{carModelID}" />

            <!-- السطر الأول: اختيار الماركة واسم الموديل -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <label class="form-label">Brand</label>
                    <select th:field="*{brandID}" class="form-select" required>
                        <option value="">-- Select Brand --</option>
                        <option th:each="brd : ${listBrands}" 
                                th:value="${brd.brandID}" 
                                th:text="${brd.nameBrand}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Car Name (Model)</label>
                    <input type="text" th:field="*{carName}" class="form-control" required placeholder="e.g., Camry, Accord..." />
                </div>
            </div>

            <!-- السطر الثاني: الشيك بوكس للتفعيل -->
            <div class="row mb-4">
                <div class="col-md-12 d-flex align-items-end pb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeCheck">
                        <label class="form-check-label form-label" for="activeCheck">
                            Is Active Model?
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">SAVE CAR MODEL</button>
            <a th:href="@{/car-models}" class="cancel-link">Back to Directory</a>
        </form>
    </div>

</body>
</html>
