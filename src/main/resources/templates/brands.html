<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Brands Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title">Brands Directory</div>
    </header>

    <div class="content-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <p class="text-muted mb-0 small">Manage manufacturer brands and origins</p>
            <a th:href="@{/brands/new}" class="btn-insert">INSERT NEW BRAND</a>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th style="width: 15%">Brand ID</th>
                    <th style="width: 35%">Brand Name</th>
                    <th style="width: 20%">Made In</th>
                    <th style="width: 15%">Status</th>
                    <th style="width: 15%" class="text-center">Operations</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="brd : ${listBrands}">
                    <td th:text="${brd.brandID}"></td>
                    <td th:text="${brd.nameBrand}" class="fw-bold"></td>
                    <td th:text="${brd.made}"></td>
                    <td th:text="${brd.active != null and brd.active ? 'Active' : 'Inactive'}" 
                        th:classappend="${brd.active != null and brd.active ? 'text-success' : 'text-danger'}"></td>
                    <td class="text-center">
                        <a th:href="@{'/brands/edit/' + ${brd.brandID}}" class="action-link edit-link me-3">EDIT</a>
                        <a th:href="@{'/brands/delete/' + ${brd.brandID}}" class="action-link delete-link" 
                           onclick="return confirm('Are you sure you want to remove this brand?')">REMOVE</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div class="mt-4">
            <a th:href="@{/dashboard}" class="cancel-link text-start">&larr; Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
