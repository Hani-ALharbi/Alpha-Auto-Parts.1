<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>System Users</title>
    <!-- مكتبة البوتستراب -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ملف التصميم الخارجي الموحد -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title">System Users Directory</div>
    </header>

    <div class="content-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <p class="text-muted mb-0 small">Manage your employees and admins</p>
            <a th:href="@{/users/new}" class="btn-insert">INSERT NEW USER</a>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th style="width: 10%">ID</th>
                    <th style="width: 25%">Username</th>
                    <th style="width: 15%">Staff ID</th>
                    <th style="width: 15%">Role</th>
                    <th style="width: 15%">Phone</th>
                    <th style="width: 20%" class="text-center">Operations</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${listUsers}">
                    <td th:text="${user.userID}"></td>
                    <td th:text="${user.username}" class="fw-bold"></td>
                    <td th:text="${user.staffID}"></td>
                    <td th:text="${user.typeUser}"></td>
                    <td th:text="${user.phoneNumber}"></td>
                    <td class="text-center">
                        <a th:href="@{'/users/edit/' + ${user.userID}}" class="action-link edit-link me-3">EDIT</a>
                        <a th:href="@{'/users/delete/' + ${user.userID}}" class="action-link delete-link" 
                           onclick="return confirm('Are you sure you want to remove this user?')">REMOVE</a>
                    </td>
                </tr>
            </tbody>
        </table>
         <div class="mt-4">
            <a th:href="@{/dashboard}" class="cancel-link text-start">&larr; Back to Dashboard</a>
        </div>
    </div>
    

</body>
</html>
