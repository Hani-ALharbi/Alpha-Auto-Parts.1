<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Add/Edit Part</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title" th:text="${pageTitle}">Add Part</div>
    </header>

    <div class="form-container">
        <!-- ربط الفورم بالكائن sparePart -->
        <form th:action="@{/spare-parts/save}" th:object="${sparePart}" method="post">
            
            <!-- حقل مخفي للـ ID عشان التعديل -->
            <input type="hidden" th:field="*{partID}" />

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Part Number</label>
                    <input type="number" th:field="*{partNumber}" class="form-control" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label">Part Name</label>
                    <input type="text" th:field="*{partName}" class="form-control" required />
                </div>
            </div>

            <!-- القوائم المنسدلة (الـ Foreign Keys) -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Category</label>
                    <select th:field="*{categoryID}" class="form-select" required>
                        <option value="">-- Select Category --</option>
                        <option th:each="cat : ${listCategories}" th:value="${cat.categoryID}" th:text="${cat.categoryName}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Brand</label>
                    <select th:field="*{brandID}" class="form-select" required>
                        <option value="">-- Select Brand --</option>
                        <option th:each="brand : ${listBrands}" th:value="${brand.brandID}" th:text="${brand.nameBrand}"></option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Car Model</label>
                    <select th:field="*{carModelID}" class="form-select" required>
                        <option value="">-- Select Car Model --</option>
                        <option th:each="model : ${listCarModels}" th:value="${model.carModelID}" th:text="${model.carName}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Supplier</label>
                    <select th:field="*{supplierID}" class="form-select" required>
                        <option value="">-- Select Supplier --</option>
                        <option th:each="sup : ${listSuppliers}" th:value="${sup.supplierID}" th:text="${sup.name}"></option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Made In</label>
                    <input type="text" th:field="*{made}" class="form-control" />
                </div>
                <div class="col-md-4">
                    <label class="form-label">Stock Quantity</label>
                    <input type="number" th:field="*{stockQuantity}" class="form-control" />
                </div>
                <div class="col-md-4">
                    <label class="form-label">Reorder Level</label>
                    <input type="number" th:field="*{reorderLevel}" class="form-control" />
                </div>
            </div>

           <div class="col-md-6">
                    <label class="form-label">Unit Price</label>
                    <select th:field="*{unitPriceID}" class="form-select" required>
                        <option value="">-- Select Price --</option>
                        <!-- اللوب هذا يجيب الأسعار من الداتا بيس ويعرضها -->
                        <option th:each="up : ${listUnitPrices}" 
                                th:value="${up.unitPriceID}" 
                                th:text="${up.price} + ' SAR'"></option>
                    </select>
                </div>
                <div class="col-md-6 d-flex align-items-end pb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeCheck">
                        <label class="form-check-label form-label" for="activeCheck">
                            Is Active?
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">SAVE SPARE PART</button>
            <a th:href="@{/spare-parts}" class="cancel-link">Back to Directory</a>
        </form>
    </div>

</body>
</html>
