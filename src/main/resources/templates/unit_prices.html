<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unit Prices Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="company-header">
        <h1 class="company-name">ALPHA AUTO PARTS</h1>
        <div class="page-title">Unit Prices Directory</div>
    </header>

    <div class="content-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <p class="text-muted mb-0 small">Manage pricing configuration</p>
            <a th:href="@{/unit-prices/new}" class="btn-insert">INSERT NEW PRICE</a>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th style="width: 20%">Price ID</th>
                    <th style="width: 40%">Price (SAR)</th>
                    <th style="width: 20%">Status</th>
                    <th style="width: 20%" class="text-center">Operations</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="up : ${listUnitPrices}">
                    <td th:text="${up.unitPriceID}"></td>
                    <td th:text="${up.price} + ' SAR'" class="fw-bold"></td>
                    <td th:text="${up.active != null and up.active ? 'Active' : 'Inactive'}" 
                        th:classappend="${up.active != null and up.active ? 'text-success' : 'text-danger'}"></td>
                    <td class="text-center">
                        <a th:href="@{'/unit-prices/edit/' + ${up.unitPriceID}}" class="action-link edit-link me-3">EDIT</a>
                        <a th:href="@{'/unit-prices/delete/' + ${up.unitPriceID}}" class="action-link delete-link" 
                           onclick="return confirm('Are you sure you want to remove this price record?')">REMOVE</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div class="mt-4">
            <a th:href="@{/dashboard}" class="cancel-link text-start">&larr; Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
