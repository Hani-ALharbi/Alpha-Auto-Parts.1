<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Alpha Auto Parts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- الكلاس login-wrapper يخلي المربع بالمنتصف تماماً -->
    <div class="login-wrapper">
        <div class="login-box">
            
            <h1 class="company-name">ALPHA</h1>
            <div class="page-title">SYSTEM PORTAL</div>

            <!-- تأكد من تعديل الـ action للرابط الصحيح في الكنترولر حقك -->
            <form th:action="@{/login}" method="post">
                
                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                <div class="mb-4 text-start">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Enter your username">
                </div>
                
                <div class="mb-5 text-start">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="Enter your password">
                </div>

                <!-- زر الدخول الوحيد -->
                <button type="submit" class="btn-enter">ENTER</button>
            </form>

        </div>
    </div>

</body>
</html>
